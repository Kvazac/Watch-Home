name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Lint self-hosted Firefox extension
        run: npm run lint:addon

      - name: Check Mozilla/privacy conformity invariants
        run: npm run check:compliance

      - name: Audit runtime dependency surface
        run: npm run audit:runtime

      - name: Dry-run Cloudflare Worker build
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
