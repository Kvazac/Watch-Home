name: Bump Watch Home version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom

      custom_version:
        description: "Only used when bump=custom, for example 1.2.3"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: watch-home-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          if [ "$BUMP_TYPE" = "custom" ]; then
            node scripts/bump-version.mjs \
              --type custom \
              --version "$CUSTOM_VERSION"
          else
            node scripts/bump-version.mjs \
              --type "$BUMP_TYPE"
          fi

      - name: Verify synchronized version
        run: |
          node scripts/verify-release.mjs "${{ steps.version.outputs.version }}"

      - name: Run tests
        run: npm test

      - name: Lint Firefox extension
        run: npm run lint:addon

      - name: Check Mozilla/privacy conformity
        run: npm run check:compliance

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Show version changes
        run: git diff -- extension/manifest.json package.json package-lock.json

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            extension/manifest.json \
            package.json \
            package-lock.json

          git commit -m "Bump Watch Home version to ${VERSION}"
          git push origin HEAD:main
