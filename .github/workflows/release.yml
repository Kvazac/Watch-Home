name: Sign and release Firefox extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from extension/manifest.json, for example 1.1.0"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Verify release configuration
        run: node scripts/verify-release.mjs "${{ inputs.version }}"

      - name: Run tests
        run: npm test

      - name: Lint self-hosted Firefox extension
        run: npm run lint:addon

      - name: Check Mozilla/privacy conformity invariants
        run: npm run check:compliance

      - name: Audit runtime dependency surface
        run: npm run audit:runtime

      - name: Dry-run Cloudflare Worker build
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Verify deployed Worker supports this client version
        run: npm run verify:compatibility:remote

      - name: Sign unlisted XPI with Mozilla
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          rm -rf signed
          mkdir -p signed
          npx web-ext sign \
            --source-dir extension \
            --artifacts-dir signed \
            --channel unlisted \
            --amo-metadata amo-metadata.json \
            --approval-timeout 900000

          SIGNED_XPI="$(find signed -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          if [ -z "$SIGNED_XPI" ]; then
            echo "Mozilla did not return a signed XPI."
            exit 1
          fi

          cp "$SIGNED_XPI" "watch-home-${{ inputs.version }}.xpi"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          XPI="watch-home-${VERSION}.xpi"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI" --clobber
          else
            gh release create "$TAG" "$XPI" \
              --target "${GITHUB_SHA}" \
              --title "Watch Home ${VERSION}" \
              --notes "Mozilla-signed Firefox release ${VERSION}."
          fi

      - name: Generate Firefox update manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p pages
          cp site/index.html pages/index.html
          cp site/privacy.html pages/privacy.html

          UPDATE_LINK="https://github.com/Kvazac/Watch-Home/releases/download/v${VERSION}/watch-home-${VERSION}.xpi"

          node scripts/generate-update-manifest.mjs \
            "$VERSION" \
            "watch-home-${VERSION}.xpi" \
            "$UPDATE_LINK" \
            > pages/updates.json

          cat pages/updates.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy update manifest to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
