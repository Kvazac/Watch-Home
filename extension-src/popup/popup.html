<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch Home</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Watch Home</h1>
      <p id="status" class="status">Checking Netflix…</p>

      <section id="idle-panel">
        <button id="create-button" class="primary" type="button">
          Create party
        </button>

        <div class="divider">or</div>

        <label for="room-input">Room code</label>
        <input
          id="room-input"
          type="text"
          maxlength="14"
          autocomplete="off"
          spellcheck="false"
          placeholder="ABCD-EFGH-JKLM"
        >
        <button id="join-button" type="button">Join party</button>
      </section>

      <section id="party-panel" hidden>
        <div class="room">
          <span>Room</span>
          <strong id="room-code"></strong>
        </div>
        <p id="party-details"></p>
        <button id="copy-button" class="primary" type="button">
          Copy invite
        </button>
        <button id="leave-button" type="button">Leave party</button>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
